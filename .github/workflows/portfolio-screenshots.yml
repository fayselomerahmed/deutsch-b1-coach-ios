name: Capture product screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Build a simulator app without production credentials
        run: xcodebuild -project DeutschB1Coach.xcodeproj -scheme DeutschB1Coach -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/PortfolioBuild" CODE_SIGNING_ALLOWED=NO build
      - name: Capture real screens using bundled local data
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          trap 'xcrun simctl status_bar "$DEVICE_ID" clear; xcrun simctl shutdown "$DEVICE_ID"' EXIT
          xcrun simctl ui "$DEVICE_ID" appearance light
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/PortfolioBuild/Build/Products/Debug-iphonesimulator/DeutschB1Coach.app"
          mkdir -p "$RUNNER_TEMP/screenshots"
          for route in home learn-books vocabulary practice; do
            xcrun simctl launch "$DEVICE_ID" "com.faysel.DeutschB1Coach" -AppleLanguages '(en)' -AppleLocale en_US -teachingLanguage en -didChooseTeachingLanguage.v1 YES -didCompleteFirstLaunchTutorial.v1 YES -didCompletePlacement YES -didChooseLearningWeakness.v1 YES -visualQARoute "$route"
            sleep 15
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/screenshots/$route.png"
            xcrun simctl terminate "$DEVICE_ID" "com.faysel.DeutschB1Coach"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
